# Vollständige kompakte Karte für die Ansicht System.
# Benötigt HA Prüfexport ab 1.0.6 und custom:button-card ab Version 6.
# Bei umbenannter Sensor-ID alle drei entity-Zeilen anpassen.
# Statuskarte antippen: Attribute, Fehlerdetails und Exporter-Version.
type: vertical-stack
cards:
- type: custom:button-card
  entity: sensor.ha_pruefexport
  name: HA Prüfexport
  icon: mdi:archive-arrow-down-outline
  show_label: true
  show_state: false
  tap_action:
    action: more-info
  hold_action:
    action: none
  double_tap_action:
    action: none
  label: |
    [[[
    const s = entity?.state;
    const a = entity?.attributes || {};
    if (!entity || !['bereit','laeuft','vollstaendig','teilweise','fehler'].includes(s)) return 'Exportstatus nicht verfügbar';
    if (a.running === true || s === 'laeuft') {
      const phase = typeof a.phase === 'string' && a.phase.trim() ? a.phase : 'Export läuft';
      return phase.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    return ({
      bereit:'Bereit für einen Export',
      vollstaendig:a.has_archive === true ? 'ZIP bereit' : 'Kein ZIP verfügbar',
      teilweise:a.has_archive === true ? 'ZIP bereit · Hinweise im Bericht' : 'Kein ZIP verfügbar',
      fehler:'Export fehlgeschlagen · Details antippen'
    })[s];
    ]]]
  custom_fields:
    percent: |
      [[[
      if (!entity || !['bereit','laeuft','vollstaendig','teilweise','fehler'].includes(entity.state)) return '';
      const a = entity.attributes || {};
      if (a.running !== true && entity.state !== 'laeuft') return '';
      return typeof a.progress_pct === 'number' && Number.isFinite(a.progress_pct)
        ? Math.max(0, Math.min(99, Math.floor(a.progress_pct))) + ' %' : '…';
      ]]]
    progress: |
      [[[
      const a = entity?.attributes || {};
      if (!entity || !['bereit','laeuft','vollstaendig','teilweise','fehler'].includes(entity.state) || (a.running !== true && entity.state !== 'laeuft')) return '';
      if (typeof a.progress_pct !== 'number' || !Number.isFinite(a.progress_pct)) return '';
      const p = Math.max(0, Math.min(99, Math.floor(a.progress_pct)));
      return '<div role="progressbar" aria-label="Exportfortschritt nach Arbeitsschritten" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + p + '" style="height:5px;border-radius:5px;background:var(--divider-color);overflow:hidden"><div style="height:100%;width:' + p + '%;background:var(--primary-color);border-radius:5px;transition:width .4s ease"></div></div>';
      ]]]
    details: |
      [[[
      if (!entity || !['bereit','laeuft','vollstaendig','teilweise','fehler'].includes(entity.state)) return '';
      const a = entity.attributes || {};
      const escape = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const finite = v => typeof v === 'number' && Number.isFinite(v) && v >= 0;
      const duration = v => {
        const seconds = Math.max(0, Math.floor(v));
        return seconds < 60 ? seconds + ' s' : Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2,'0') + ' min';
      };
      const date = v => {
        if (typeof v !== 'string' || !/(Z|[+-]\d\d:\d\d)$/.test(v)) return null;
        const d = new Date(v);
        return Number.isFinite(d.getTime()) ? d : null;
      };
      const time = v => {
        const d = date(v);
        if (!d) return 'Datum unbekannt';
        try {
          return new Intl.DateTimeFormat('de-DE', {
            timeZone:hass?.config?.time_zone || 'UTC',
            day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'
          }).format(d);
        } catch { return 'Datum nicht beurteilbar'; }
      };
      const running = a.running === true || entity.state === 'laeuft';
      const lines = [];
      if (running) {
        const info = [];
        if (finite(a.processed) && typeof a.unit === 'string') {
          info.push(Math.floor(a.processed).toLocaleString('de-DE') +
            (finite(a.total) && a.total > 0 ? ' / ' + Math.floor(a.total).toLocaleString('de-DE') : '') + ' ' + escape(a.unit));
        }
        if (finite(a.elapsed_seconds)) info.push(duration(a.elapsed_seconds));
        if (info.length) lines.push(info.join(' · '));
        const heartbeat = date(a.heartbeat_at);
        const changed = date(a.last_progress_at);
        if (heartbeat && Date.now() - heartbeat.getTime() > 15000) {
          lines.push('<span style="color:var(--warning-color,#f9a825)">Status seit ' + duration((Date.now() - heartbeat.getTime()) / 1000) + ' nicht aktualisiert</span>');
        } else if (changed && Date.now() - changed.getTime() > 120000) {
          lines.push('<span style="color:var(--warning-color,#f9a825)">Seit ' + duration((Date.now() - changed.getTime()) / 1000) + ' kein neuer Fortschritt</span>');
        }
      } else if (a.has_archive === true) {
        const info = [];
        if (finite(a.archive_bytes)) info.push((a.archive_bytes / 1048576).toLocaleString('de-DE', {maximumFractionDigits:1}) + ' MB');
        if (finite(a.archive_sources)) info.push(Math.floor(a.archive_sources).toLocaleString('de-DE') + ' Dateien');
        lines.push('<div style="display:flex;flex-wrap:wrap;gap:2px 12px"><span>' +
          (entity.state === 'fehler' ? 'Vorheriges ZIP · ' : '') + time(a.archive_finished) +
          '</span>' + (info.length ? '<span>' + info.join(' · ') + '</span>' : '') + '</div>');
      } else if (entity.state === 'fehler') {
        lines.push('Noch kein ZIP verfügbar');
      }
      if (hass?.user?.is_admin === false) lines.push('Erstellen und Herunterladen nur als Administrator');
      return lines.join('<br>');
      ]]]
  styles:
    grid:
    - grid-template-areas: '"i n percent" "i l percent" "progress progress progress" "details details details"'
    - grid-template-columns: 36px minmax(0, 1fr) auto
    - grid-template-rows: min-content min-content min-content min-content
    - column-gap: 8px
    card:
    - padding: 12px
    - border-radius: 16px
    - box-shadow: none
    icon:
    - width: 24px
    - color: |
        [[[
        if (!entity || !['bereit','laeuft','vollstaendig','teilweise','fehler'].includes(entity.state)) return 'var(--disabled-text-color)';
        if (entity.attributes?.running === true || entity.state === 'laeuft') return 'var(--primary-color)';
        return ({vollstaendig:'var(--success-color,#43a047)',teilweise:'var(--warning-color,#f9a825)',fehler:'var(--error-color,#db4437)'})[entity.state] || 'var(--secondary-text-color)';
        ]]]
    name:
    - justify-self: start
    - font-size: 16px
    - font-weight: 600
    - line-height: 1.3
    label:
    - justify-self: start
    - text-align: left
    - white-space: normal
    - overflow-wrap: anywhere
    - font-size: 12px
    - line-height: 1.4
    - color: var(--secondary-text-color)
    custom_fields:
      percent:
      - align-self: center
      - font-size: 14px
      - font-weight: 600
      - color: var(--primary-color)
      progress:
      - width: 100%
      - text-align: left
      - margin-top: |
          [[[
          const a = entity?.attributes || {};
          return entity && ['bereit','laeuft','vollstaendig','teilweise','fehler'].includes(entity.state) && (a.running === true || entity.state === 'laeuft') && typeof a.progress_pct === 'number' && Number.isFinite(a.progress_pct) ? '10px' : '0';
          ]]]
      details:
      - justify-self: stretch
      - text-align: left
      - white-space: normal
      - overflow-wrap: anywhere
      - font-size: 12px
      - line-height: 1.5
      - margin-top: |
          [[[
          const a = entity?.attributes || {};
          return entity && ['bereit','laeuft','vollstaendig','teilweise','fehler'].includes(entity.state) && (a.running === true || entity.state === 'laeuft' || a.has_archive === true || entity.state === 'fehler' || hass?.user?.is_admin === false) ? '8px' : '0';
          ]]]
      - color: var(--secondary-text-color)
    img_cell:
    - width: 36px
    - height: 36px
    - border-radius: 10px
    - background: var(--secondary-background-color)
- type: horizontal-stack
  cards:
  - type: custom:button-card
    entity: sensor.ha_pruefexport
    name: |
      [[[
      return entity?.attributes?.running === true || entity?.state === 'laeuft' ? 'Läuft …' : 'Export erstellen';
      ]]]
    icon: |
      [[[ return entity?.attributes?.running === true || entity?.state === 'laeuft' ? 'mdi:progress-clock' : 'mdi:archive-plus-outline'; ]]]
    show_state: false
    tap_action:
      action: |
        [[[
          return entity && entity.attributes?.running !== true && ['bereit','vollstaendig','teilweise','fehler'].includes(entity.state) && hass.user?.is_admin === true ? 'call-service' : 'none';
        ]]]
      service: ha_pruefexport.export
    hold_action:
      action: none
    double_tap_action:
      action: none
    styles:
      grid:
      - grid-template-areas: '"i n"'
      - grid-template-columns: 20px minmax(0, 1fr)
      - grid-template-rows: min-content
      - column-gap: 6px
      card:
      - padding: 8px 10px
      - min-height: 44px
      - border-radius: 14px
      - box-shadow: none
      - opacity: |
          [[[ return entity && entity.attributes?.running !== true && ['bereit','vollstaendig','teilweise','fehler'].includes(entity.state) && hass.user?.is_admin === true ? '1' : '0.6'; ]]]
      img_cell:
      - width: 20px
      icon:
      - width: 20px
      name:
      - font-size: 12px
      - white-space: normal
      - line-height: 1.25
  - type: custom:button-card
    entity: sensor.ha_pruefexport
    name: |
      [[[
      if (entity?.attributes?.has_archive === true && (entity.attributes?.running === true || ['laeuft','fehler'].includes(entity.state))) return 'Vorheriges ZIP';
      return entity && ['bereit','vollstaendig','teilweise','fehler'].includes(entity.state) && entity.attributes?.has_archive !== true ? 'Kein ZIP' : 'ZIP herunterladen';
      ]]]
    icon: mdi:download
    show_state: false
    tap_action:
      action: javascript
      javascript: |
        [[[
          const path = entity?.attributes?.download_path;
          const valid = /^\/api\/ha_pruefexport\/download\/ha_pruefexport_\d{8}_\d{6}_[a-f0-9]{8}\.zip$/;
          if (entity?.attributes?.has_archive !== true || !['bereit','laeuft','vollstaendig','teilweise','fehler'].includes(entity?.state) || hass.user?.is_admin !== true || typeof path !== 'string' || !valid.test(path)) return;
          hass.callWS({type:'auth/sign_path', path, expires:60})
            .then(result => {
              const url = new URL(result.path, window.location.origin);
              if (url.origin !== window.location.origin || url.pathname !== path || !url.searchParams.has('authSig')) throw new Error('Ungültiger Downloadpfad');
              window.location.assign(url.href);
            })
            .catch(() => alert('Download fehlgeschlagen. Bitte als HA-Administrator anmelden und erneut versuchen.'));
        ]]]
    hold_action:
      action: none
    double_tap_action:
      action: none
    styles:
      grid:
      - grid-template-areas: '"i n"'
      - grid-template-columns: 20px minmax(0, 1fr)
      - grid-template-rows: min-content
      - column-gap: 6px
      card:
      - padding: 8px 10px
      - min-height: 44px
      - border-radius: 14px
      - box-shadow: none
      - opacity: |
          [[[
          return entity?.attributes?.has_archive === true && ['bereit','laeuft','vollstaendig','teilweise','fehler'].includes(entity?.state) && hass.user?.is_admin === true ? '1' : '0.4';
          ]]]
      img_cell:
      - width: 20px
      icon:
      - width: 20px
      name:
      - font-size: 12px
      - white-space: normal
      - line-height: 1.25
