# Vollständige zusätzliche Karte für die Ansicht System.
# Die Integration erzeugt sensor.ha_pruefexport. Bei bewusst umbenannter ID hier anpassen.
# Benötigt custom:button-card mit JavaScript-Aktionen (Version 6 oder neuer).
type: vertical-stack
cards:
  - type: custom:button-card
    entity: sensor.ha_pruefexport
    name: HA Prüfexport
    icon: mdi:archive-arrow-down-outline
    show_label: true
    show_state: false
    tap_action:
      action: more-info
    hold_action:
      action: none
    double_tap_action:
      action: none
    label: |
      [[[
        const s = entity?.state;
        const a = entity?.attributes || {};
        if (!entity || ['unknown','unavailable'].includes(s)) return 'Exportstatus nicht verfügbar';
        if (a.running === true || s === 'laeuft') {
          const p = typeof a.progress_pct === 'number' && Number.isFinite(a.progress_pct) ? Math.max(0, Math.min(99, Math.floor(a.progress_pct))) : null;
          return p === null ? 'Export läuft' : 'Export läuft · ' + p + ' %';
        }
        const labels = {
          bereit: 'Bereit · noch kein Export',
          laeuft: 'Export läuft',
          vollstaendig: 'Export erstellt · vollständig im erfassten Umfang',
          teilweise: 'Export erstellt · Umfang prüfen',
          fehler: 'Letzter Versuch fehlgeschlagen'
        };
        return labels[s] || 'Exportstatus nicht verfügbar';
      ]]]
    custom_fields:
      progress: |
        [[[
          const a = entity?.attributes || {};
          if (!entity || ['unknown','unavailable'].includes(entity.state)) return '';
          const running = a.running === true || entity.state === 'laeuft';
          if (typeof a.progress_pct !== 'number' || !Number.isFinite(a.progress_pct)) {
            return running ? '<div style="font-size:12px;color:var(--secondary-text-color)">Fortschritt noch nicht gemeldet</div>' : '';
          }
          const p = Math.max(0, Math.min(running ? 99 : 100, Math.floor(a.progress_pct)));
          const color = running ? 'var(--primary-color)' : entity.state === 'fehler' ? 'var(--error-color,#db4437)' : entity.state === 'teilweise' ? 'var(--warning-color,#f9a825)' : 'var(--success-color,#43a047)';
          return '<div role="progressbar" aria-label="Prüfexport nach Arbeitsschritten" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + p + '" style="height:8px;border-radius:8px;background:var(--divider-color);overflow:hidden"><div style="height:100%;width:' + p + '%;background:' + color + ';border-radius:8px;transition:width .4s ease"></div></div>' +
            '<div style="margin-top:5px;font-size:11px;color:var(--secondary-text-color)">' + (running ? 'Fortschritt nach Arbeitsschritten' : entity.state === 'fehler' ? 'Export abgebrochen bei ' + p + ' %' : 'Abgeschlossen · ' + p + ' %') + '</div>';
        ]]]
      details: |
        [[[
          const a = entity?.attributes || {};
          const escape = (v) => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          const time = (v, clock = false) => {
            if (typeof v !== 'string' || !/(Z|[+-]\d\d:\d\d)$/.test(v)) return 'Nicht vorhanden';
            const d = new Date(v);
            if (!Number.isFinite(d.getTime())) return 'Nicht beurteilbar';
            const zone = hass?.config?.time_zone || 'UTC';
            try {
              const format = clock ? {hour:'2-digit',minute:'2-digit',second:'2-digit'} : {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'};
              return new Intl.DateTimeFormat('de-DE', { timeZone:zone, ...format }).format(d);
            } catch {
              return 'Nicht beurteilbar';
            }
          };
          const finite = (v) => typeof v === 'number' && Number.isFinite(v) && v >= 0;
          const duration = (v) => {
            const seconds = Math.max(0, Math.floor(v));
            return Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2,'0') + ' min';
          };
          const running = entity && !['unknown','unavailable'].includes(entity.state) && (a.running === true || entity.state === 'laeuft');
          const lines = [];
          if (running) {
            lines.push('<b>' + escape(a.phase || 'Export wird vorbereitet') + '</b>');
            if (finite(a.processed) && typeof a.unit === 'string') {
              const count = Math.floor(a.processed).toLocaleString('de-DE');
              lines.push(count + (finite(a.total) && a.total > 0 ? ' / ' + Math.floor(a.total).toLocaleString('de-DE') : '') + ' ' + escape(a.unit));
            }
            if (finite(a.elapsed_seconds)) lines.push('Laufzeit: ' + duration(a.elapsed_seconds));
            if (typeof a.heartbeat_at === 'string') lines.push('Letzte Statusmeldung: ' + time(a.heartbeat_at, true));
            const changed = Date.parse(a.last_progress_at);
            if (Number.isFinite(changed) && Date.now() - changed > 120000) lines.push('Dieser Schritt dauert länger · seit ' + duration((Date.now() - changed) / 1000) + ' kein neuer Fortschritt');
          }
          if (a.has_archive === true) {
            lines.push((running ? 'Vorheriges ZIP: ' : 'Letztes ZIP: ') + time(a.archive_finished));
            const info = [];
            if (finite(a.archive_bytes)) info.push((a.archive_bytes / 1048576).toLocaleString('de-DE', {maximumFractionDigits:1}) + ' MB');
            if (finite(a.archive_sources)) info.push(a.archive_sources + ' Quelldateien');
            if (info.length) lines.push(info.join(' · '));
            if (a.archive_status === 'teilweise') lines.push('Lücken und Grenzen stehen im Exportbericht');
          } else if (!running) lines.push('Noch kein ZIP zum Herunterladen');
          if (entity?.state === 'fehler') {
            lines.push('Letzter Versuch: ' + time(a.last_finished));
            if (a.last_error) lines.push(escape(a.last_error));
            if (a.has_archive === true) lines.push('Download enthält das vorherige ZIP');
          }
          if (!running && finite(a.elapsed_seconds)) lines.push('Letzte Laufzeit: ' + duration(a.elapsed_seconds));
          if (typeof a.exporter_version === 'string') lines.push('<span style="font-size:11px">Version ' + escape(a.exporter_version) + '</span>');
          return lines.join('<br>');
        ]]]
    styles:
      grid:
        - grid-template-areas: '"i n" "i l" "progress progress" "details details"'
        - grid-template-columns: 44px 1fr
        - grid-template-rows: min-content min-content min-content min-content
      card:
        - padding: 16px
      icon:
        - width: 28px
        - color: |
            [[[
              return ({ laeuft:'var(--primary-color)', vollstaendig:'var(--success-color, #43a047)', teilweise:'var(--warning-color, #f9a825)', fehler:'var(--error-color, #db4437)' })[entity?.state] || 'var(--disabled-text-color)';
            ]]]
      name:
        - justify-self: start
        - font-size: 17px
        - font-weight: 600
      label:
        - justify-self: start
        - text-align: left
        - white-space: normal
        - font-size: 13px
        - color: var(--secondary-text-color)
      custom_fields:
        progress:
          - width: 100%
          - text-align: left
          - margin-top: 12px
        details:
          - justify-self: start
          - text-align: left
          - white-space: normal
          - font-size: 13px
          - line-height: 1.55
          - margin-top: 10px
          - color: var(--secondary-text-color)
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        entity: sensor.ha_pruefexport
        name: |
          [[[ return entity?.attributes?.running === true || entity?.state === 'laeuft' ? 'Export läuft …' : 'Export erstellen'; ]]]
        icon: |
          [[[ return entity?.attributes?.running === true || entity?.state === 'laeuft' ? 'mdi:progress-clock' : 'mdi:archive-plus-outline'; ]]]
        show_state: false
        tap_action:
          action: |
            [[[
              return entity && entity.attributes?.running !== true && ['bereit','vollstaendig','teilweise','fehler'].includes(entity.state) && hass.user?.is_admin === true ? 'call-service' : 'none';
            ]]]
          service: ha_pruefexport.export
        hold_action:
          action: none
        double_tap_action:
          action: none
        styles:
          card:
            - padding: 12px
            - opacity: |
                [[[ return entity && entity.attributes?.running !== true && ['bereit','vollstaendig','teilweise','fehler'].includes(entity.state) && hass.user?.is_admin === true ? '1' : '0.6'; ]]]
          icon:
            - width: 24px
          name:
            - font-size: 13px
      - type: custom:button-card
        entity: sensor.ha_pruefexport
        name: |
          [[[ return entity?.attributes?.has_archive === true && (entity.attributes?.running === true || entity.state === 'laeuft') ? 'Vorheriges ZIP' : 'ZIP herunterladen'; ]]]
        icon: mdi:download
        show_state: false
        tap_action:
          action: javascript
          javascript: |
            [[[
              const path = entity?.attributes?.download_path;
              const valid = /^\/api\/ha_pruefexport\/download\/ha_pruefexport_\d{8}_\d{6}_[a-f0-9]{8}\.zip$/;
              if (entity?.attributes?.has_archive !== true || !['bereit','laeuft','vollstaendig','teilweise','fehler'].includes(entity?.state) || hass.user?.is_admin !== true || typeof path !== 'string' || !valid.test(path)) return;
              hass.callWS({type:'auth/sign_path', path, expires:60})
                .then(result => {
                  const url = new URL(result.path, window.location.origin);
                  if (url.origin !== window.location.origin || url.pathname !== path || !url.searchParams.has('authSig')) throw new Error('Ungültiger Downloadpfad');
                  window.location.assign(url.href);
                })
                .catch(() => alert('Download fehlgeschlagen. Bitte als HA-Administrator anmelden und erneut versuchen.'));
            ]]]
        hold_action:
          action: none
        double_tap_action:
          action: none
        styles:
          card:
            - padding: 12px
            - opacity: |
                [[[ return entity?.attributes?.has_archive === true && !['unknown','unavailable'].includes(entity?.state) && hass.user?.is_admin === true ? '1' : '0.4'; ]]]
          icon:
            - width: 24px
          name:
            - font-size: 13px
