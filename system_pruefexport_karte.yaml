# Vollständige zusätzliche Karte für die Ansicht System.
# Die Integration erzeugt sensor.ha_pruefexport. Bei bewusst umbenannter ID hier anpassen.
# Benötigt custom:button-card mit JavaScript-Aktionen (Version 6 oder neuer).
type: vertical-stack
cards:
  - type: custom:button-card
    entity: sensor.ha_pruefexport
    name: HA Prüfexport
    icon: mdi:archive-arrow-down-outline
    show_label: true
    show_state: false
    tap_action:
      action: more-info
    hold_action:
      action: none
    double_tap_action:
      action: none
    label: |
      [[[
        const s = entity?.state;
        const a = entity?.attributes || {};
        const labels = {
          bereit: 'Bereit · noch kein Export',
          laeuft: 'Export läuft',
          vollstaendig: 'Export erstellt · vollständig im erfassten Umfang',
          teilweise: 'Export erstellt · Umfang prüfen',
          fehler: 'Letzter Versuch fehlgeschlagen'
        };
        return labels[s] || 'Exportstatus nicht verfügbar';
      ]]]
    custom_fields:
      details: |
        [[[
          const a = entity?.attributes || {};
          const escape = (v) => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          const time = (v) => {
            if (typeof v !== 'string' || !/(Z|[+-]\d\d:\d\d)$/.test(v)) return 'Nicht vorhanden';
            const d = new Date(v);
            if (!Number.isFinite(d.getTime())) return 'Nicht beurteilbar';
            const zone = hass?.config?.time_zone || 'UTC';
            try {
              return new Intl.DateTimeFormat('de-DE', { timeZone:zone, day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }).format(d);
            } catch {
              return 'Nicht beurteilbar';
            }
          };
          const finite = (v) => typeof v === 'number' && Number.isFinite(v) && v >= 0;
          const lines = [];
          if (entity?.state === 'laeuft') lines.push(escape(a.phase || 'Bitte warten'));
          if (a.has_archive === true) {
            lines.push('Letztes ZIP: ' + time(a.archive_finished));
            const info = [];
            if (finite(a.archive_bytes)) info.push((a.archive_bytes / 1048576).toLocaleString('de-DE', {maximumFractionDigits:1}) + ' MB');
            if (finite(a.archive_sources)) info.push(a.archive_sources + ' Quelldateien');
            if (info.length) lines.push(info.join(' · '));
            if (a.archive_status === 'teilweise') lines.push('Lücken und Grenzen stehen im Exportbericht');
          } else if (entity?.state !== 'laeuft') lines.push('Noch kein ZIP zum Herunterladen');
          if (entity?.state === 'fehler') {
            lines.push('Letzter Versuch: ' + time(a.last_finished));
            if (a.last_error) lines.push(escape(a.last_error));
            if (a.has_archive === true) lines.push('Download enthält das vorherige ZIP');
          }
          return lines.join('<br>');
        ]]]
    styles:
      grid:
        - grid-template-areas: '"i n" "i l" "details details"'
        - grid-template-columns: 44px 1fr
        - grid-template-rows: min-content min-content min-content
      card:
        - padding: 16px
      icon:
        - width: 28px
        - color: |
            [[[
              return ({ laeuft:'var(--primary-color)', vollstaendig:'var(--success-color, #43a047)', teilweise:'var(--warning-color, #f9a825)', fehler:'var(--error-color, #db4437)' })[entity?.state] || 'var(--disabled-text-color)';
            ]]]
      name:
        - justify-self: start
        - font-size: 17px
        - font-weight: 600
      label:
        - justify-self: start
        - text-align: left
        - white-space: normal
        - font-size: 13px
        - color: var(--secondary-text-color)
      custom_fields:
        details:
          - justify-self: start
          - text-align: left
          - white-space: normal
          - font-size: 13px
          - line-height: 1.55
          - margin-top: 10px
          - color: var(--secondary-text-color)
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        entity: sensor.ha_pruefexport
        name: Export erstellen
        icon: mdi:archive-plus-outline
        show_state: false
        tap_action:
          action: |
            [[[
              return entity && ['bereit','vollstaendig','teilweise','fehler'].includes(entity.state) && hass.user?.is_admin === true ? 'call-service' : 'none';
            ]]]
          service: ha_pruefexport.export
          service_data:
            pruefmodus: methode
        hold_action:
          action: none
        double_tap_action:
          action: none
        styles:
          card:
            - padding: 12px
            - opacity: |
                [[[ return entity && ['bereit','vollstaendig','teilweise','fehler'].includes(entity.state) && hass.user?.is_admin === true ? '1' : '0.4'; ]]]
          icon:
            - width: 24px
          name:
            - font-size: 13px
      - type: custom:button-card
        entity: sensor.ha_pruefexport
        name: ZIP herunterladen
        icon: mdi:download
        show_state: false
        tap_action:
          action: javascript
          javascript: |
            [[[
              const path = entity?.attributes?.download_path;
              const valid = /^\/api\/ha_pruefexport\/download\/ha_pruefexport_\d{8}_\d{6}_[a-f0-9]{8}\.zip$/;
              if (entity?.attributes?.has_archive !== true || !['bereit','laeuft','vollstaendig','teilweise','fehler'].includes(entity?.state) || hass.user?.is_admin !== true || typeof path !== 'string' || !valid.test(path)) return;
              hass.callWS({type:'auth/sign_path', path, expires:60})
                .then(result => {
                  const url = new URL(result.path, window.location.origin);
                  if (url.origin !== window.location.origin || url.pathname !== path || !url.searchParams.has('authSig')) throw new Error('Ungültiger Downloadpfad');
                  window.location.assign(url.href);
                })
                .catch(() => alert('Download fehlgeschlagen. Bitte als HA-Administrator anmelden und erneut versuchen.'));
            ]]]
        hold_action:
          action: none
        double_tap_action:
          action: none
        styles:
          card:
            - padding: 12px
            - opacity: |
                [[[ return entity?.attributes?.has_archive === true && !['unknown','unavailable'].includes(entity?.state) && hass.user?.is_admin === true ? '1' : '0.4'; ]]]
          icon:
            - width: 24px
          name:
            - font-size: 13px
